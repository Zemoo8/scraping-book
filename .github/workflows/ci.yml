name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all sources
        run: python -m compileall -q app.py src
      - name: Import pipeline modules
        run: python -c "import src.scraper, src.cleaner, src.database, src.analysis, src.prediction; print('imports ok')"
